name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run validate:dates
      - run: deno task snapshot:3b:check

  # The migration verification superset. The pre-push hook routes by changed
  # surface to stay under a workable push time; CI runs EVERY suite regardless of
  # what the diff touched, so a routing mistake costs a red CI run rather than a
  # silent gap.
  #
  # That claim was FALSE until 2026-09-04. `migration:all` selected `--tier push`
  # only, so five registered ci-tier suites ran nowhere -- including
  # `migration:gsap-palette:controls`, the 86-control suite gate G2's approval
  # cites as its evidence. It now selects `--tier all`, minus the one suite that
  # has its own parallel job below, and `migration:route:controls` fails closed
  # if any registered suite is reachable by neither path.
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `migration:projection` grafts the current baseline onto its frozen
          # parent via `git show`, so the history must be present.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both outputs: the suites read `build/` (Svelte) and `next/build/` (Next).
      - run: pnpm run build

      - name: Router controls
        run: pnpm run migration:route:controls

      # `migration:parity:progress` is inside this selection, not a separate step:
      # the Next comparator exits 1 by design until the surface port closes
      # parity. `continue-on-error` would have been the easy way to tolerate
      # that, and it also swallows a missing build (exit 2) and a malformed or
      # stale ledger (also exit 1). The suite JUDGES the exit instead: expected
      # drift passes and is reported as a number, a broken harness fails the job.
      - name: Full migration suite
        run: pnpm run migration:all

  # Split out because it is ~265 s on its own — more than the other suites
  # combined — since each of its controls re-captures the whole 366-page build.
  # Parallel job, so it never serializes behind the rest. This is the one suite
  # `migration:all` excludes by name; the router's `--exclude` is fail-closed, so
  # a typo there breaks CI rather than silently dropping a suite.
  migration-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run migration:controls
