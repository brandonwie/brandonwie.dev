name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run validate:dates
      - run: deno task snapshot:3b:check

  # The migration verification set. The pre-push hook routes by changed surface
  # to stay under a workable push time; CI runs every suite it CAN run regardless
  # of what the diff touched, so a routing mistake costs a red CI run rather than
  # a silent gap.
  #
  # "Every suite" was FALSE until 2026-09-04: `migration:all` selected
  # `--tier push` only, so five registered ci-tier suites ran nowhere --
  # including `migration:gsap-palette:controls`, the 86-control suite gate G2's
  # approval cites as its evidence.
  #
  # EXACTLY WHAT THIS JOB RUNS, stated so the comment cannot drift from the
  # command again: `migration:all` selects `--tier all` MINUS three named
  # exclusions --
  #
  #   migration:controls          has its own parallel job below (~265 s)
  #   migration:c3                its 13 3B-dependent rows need a 3B checkout
  #   migration:c3:controls       same, for the controls that drive those rows
  #
  # The C3 exclusion is a lane split, not a hole: `migration:c3:hermetic` and
  # `migration:c3:hermetic:controls` run HERE and cover the four rows that read
  # only this checkout plus the LB-01/LB-02 loopback regressions.
  # `assert-c3-runtimes.ts` asserts the two lanes partition its rows exactly
  # once, and `migration:route:controls` fails closed if any registered suite is
  # reachable by no runner at all -- including a push-tier suite whose only
  # runner, the pre-push hook, has stopped invoking the router.
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `migration:projection` grafts the current baseline onto its frozen
          # parent via `git show`, so the history must be present.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      # `migration:c3:hermetic` drives four `deno task` surfaces. Without a Deno
      # toolchain they do not skip -- they run and fail, which is what happened
      # the first time this job selected `--tier all`. C1's S1 scenario is the
      # same shape and says the honest outcome of an absent runtime is
      # INCONCLUSIVE, not pass; installing it here removes the question.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      # Both outputs: the suites read `build/` (Svelte) and `next/build/` (Next).
      - run: pnpm run build

      - name: Router controls
        run: pnpm run migration:route:controls

      # `migration:parity:progress` is inside this selection, not a separate step:
      # the Next comparator exits 1 by design until the surface port closes
      # parity. `continue-on-error` would have been the easy way to tolerate
      # that, and it also swallows a missing build (exit 2) and a malformed or
      # stale ledger (also exit 1). The suite JUDGES the exit instead: expected
      # drift passes and is reported as a number, a broken harness fails the job.
      - name: Full migration suite
        run: pnpm run migration:all

  # Split out because it is ~265 s on its own — more than the other suites
  # combined — since each of its controls re-captures the whole 366-page build.
  # Parallel job, so it never serializes behind the rest. This is the one suite
  # `migration:all` excludes by name; the router's `--exclude` is fail-closed, so
  # a typo there breaks CI rather than silently dropping a suite.
  migration-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run migration:controls
