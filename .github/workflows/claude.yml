name: Claude Code

# Any @claude mention except "@claude review" (claude-code-review.yml handles
# that) runs the shared assistant workflow in brandonwie/claude-review, which
# owns the trigger, action pin, token routing and permissions.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: brandonwie/claude-review/.github/workflows/claude-assistant.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
