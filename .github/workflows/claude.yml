name: Claude Code

# General-purpose @claude assistant. Handles ad-hoc questions, code suggestions,
# typo fixes, and any @claude mention that is NOT "@claude review" (formal PR
# reviews are handled by claude-code-review.yml to keep responsibilities split).
#
# Trigger surface: any @claude mention EXCEPT "@claude review" in:
#   - issue comments       (PRs included; GitHub PRs surface as issue_comment)
#   - PR review comments
#   - PR reviews (submission body)
#   - new / assigned issues (body or title)
#
# Security note: github.event.*.body / .title fields appear ONLY inside
# `if:` contains() expressions which are YAML-evaluated at workflow dispatch
# time. They are NEVER interpolated into `run:` shell commands. See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Fire on @claude mentions EVERYWHERE except "@claude review" on PR
    # comments. The negative match prevents this workflow + the dedicated
    # review workflow firing twice on the same comment.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # @claude may be asked to fix typos / amend posts
      pull-requests: write # required so Claude can post comments on PRs
      issues: write # required so Claude can comment on issues
      id-token: write
      actions: read # let Claude read CI results when troubleshooting
    steps:
      - name: Validate Claude token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not configured. Set via: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo brandonwie/brandonwie.dev"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to v1.0.105 (commit e58dfa55, 2026-04-23) — last pre-regression
        # release. v1.0.106..v1.0.113 ship a bundled install.sh that exits 0 but
        # does NOT place the claude binary at /home/runner/.local/bin/claude
        # (anthropics/claude-code-action#1254 + #1260, both open as of
        # 2026-05-06). Same pin as claude-code-review.yml — both workflows must
        # stay in lockstep until upstream lands the #1260 SDK fallback fix.
        uses: anthropics/claude-code-action@e58dfa55559035499a4982426bb73605e8b5ad8e # v1.0.105
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI / GitHub Actions results when troubleshooting.
          additional_permissions: |
            actions: read

          # No custom prompt — Claude reads the comment that triggered the run
          # and acts on its instructions directly. For formal PR reviews use
          # "@claude review" which routes to claude-code-review.yml instead.
