  - "CLAUDE.md says '52 posts across 9 categories' → actual 139 EN / 139 KO across 11 categories, 100% KO coverage"
  - 'CLAUDE.md omits routes: /search, /stats, /system, /system/3b (+ KO mirrors)'
  - 'CLAUDE.md omits components: SearchPage, StatsPage, System3b* (6), Giscus, TableOfContents'
  - 'CLAUDE.md lists only remark-reading-time plugin → actual 3 (added toc-extract, mermaid-component)'
  - 'CLAUDE.md implies shadcn-svelte in use → ui/ dir is empty/unused'
  - "CLAUDE.md doesn't mention Deno/tsx split, Pagefind, Umami, Giscus, OG generation, Node 24, pnpm, Vite 8, ESLint 10"
  - "CLAUDE.md 'pnpm sync' is one of 5 sync modes; CI + 2 husky hooks undocumented"
  - "AGENTS.md still describes the repo as 'Next.js + content/MDX pipeline' (lines 14, 22) — wrong framework; Codex SoT, fix at the 3B project source"

# -----------------------------------------------------------------------------
# KNOWN RISKS — flagged for verification/fix (detail + pros/cons in improvements.md)
# -----------------------------------------------------------------------------
known_risks:
  i18n_ssr_locale: 'ko/+layout.svelte setLocale in onMount (client). Paraglide url-strategy may cover SSR — VERIFY KO prerendered HTML actually contains Korean before fixing.'
  draft_exposure: '[slug] loaders resolve any slug incl draft:true — direct URL shows draft content (list views correctly filter)'
  prerender_coverage: 'no entries() — a post not linked anywhere is silently not prerendered (strict:true crawler-only)'
  og_gap: '45 of 139 posts lack a slug OG image (94 present + 1 default) — manual og:generate, no build failure'
  store_hydration: 'terminal features (grep/fuzzy) broken on deep-links until home visited'
  frontmatter_schema: 'app.d.ts:17 metadata is Record<string,unknown>, cast to PostMetadata in loaders — no runtime validation'
  hashless_posts: '3 EN ai-ml posts lack source_content_hash (karpathy-llm-knowledge-bases, next-intelligence-explosion-social, six-papers-zero-applied) — invisible to sync:check'
  deno_task_perms: 'deno.json sync task lacks --allow-env that package.json sync has (sync-from-3b.ts reads env)'
  dep_advisories: 'reviewer pnpm audit --prod (2026-06-03): 2 high + 15 moderate prod advisories'
