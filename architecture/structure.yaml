# =============================================================================
# brandonwie.dev — Architecture Map (machine + human readable source of truth)
# -----------------------------------------------------------------------------
# Generated by orchestrated multi-agent analysis on 2026-06-03 (commit 5e467d4).
# This file is the canonical structural map. When code changes, update THIS file.
# The project CLAUDE.md prose had drifted from reality — see `known_drift:` below.
# Companion docs: ./README.md (navigation), ./improvements.md (renewal backlog).
# =============================================================================

meta:
  project: brandonwie.dev
  type: personal-blog (SSG) + interactive terminal UI
  domain: brandonwie.dev
  hosting: Cloudflare Pages (precompressed .br/.gz, edge-served)
  repo: github.com/brandonwie/brandonwie.dev
  generated: '2026-06-03'
  generated_from_commit: 5e467d4
  analysis_method: 5 parallel code-explorer agents (routing, content+i18n, terminal, blog-ui, build) + verification pass
  scale:
    source_files_ts_svelte_js: ~55
    component_files: 21 # 17 top-level + 4 terminal (src/lib/components/ui/ is EMPTY)
    command_files: 11 # 18 registered command names
    posts_en: 139
    posts_ko: 139
    ko_coverage: '100%'
    categories: 11 # ai-ml aws backend data devops frontend general google icalendar payments security
    og_images_present: 95 # 94 post-specific + 1 'default'; 45 of 139 EN posts lack a slug OG image

stack:
  framework: SvelteKit 2 (Svelte 5 runes) + adapter-static (pure SSG)
  build_tool: Vite 8
  language: TypeScript 5.7 (strict, verbatimModuleSyntax, checkJs)
  styling: Tailwind CSS v4 (CSS-first, @theme in app.css) + @tailwindcss/typography
  i18n: Paraglide-JS 2 (inlang message-format), EN base + /ko prefix
  markdown: mdsvex 0.12 + remark/rehype chain + Shiki 4 (github-dark)
  search: Pagefind 1.4 (build-time full-text index) + Fuse.js 7 (terminal fuzzy)
  diagrams: Mermaid 11 (lazy) + @xyflow/svelte 1.6 + @dagrejs/dagre 3 (system graph)
  comments: Giscus (GitHub Discussions)
  analytics: Umami (self-hosted API)
  fonts: JetBrains Mono
  package_manager: pnpm 10.32.1 (Corepack-pinned)
  script_runtimes: { deno: '2.x (content pipeline)', tsx: 'node (translation/og/validate)' }
  node: '24 (.node-version)'
  testing: NONE # no vitest/jest/playwright/@testing-library — see improvements P1-TEST

# -----------------------------------------------------------------------------
# ENTRY POINTS — where the app boots and global behavior is wired
# -----------------------------------------------------------------------------
entry_points:
  - path: src/app.html
    loc: 23
    role: HTML shell; Google Fonts preconnect, JetBrains Mono, Umami script, sveltekit preload=hover
    note: 'lang="en" is HARDCODED — not switched for /ko/* routes (a11y/SEO gap)'
  - path: src/routes/+layout.ts
    loc: 5
    role: Global SSG flags — `prerender = true`, `trailingSlash = 'never'` (cascades to all routes)
  - path: src/routes/+layout.svelte
    loc: 178
    role: Root layout — default OG/Twitter meta, RSS <link>s, View Transitions (onNavigate), Cmd+F→/search, hidden per-locale crawler anchors for SSG discovery
  - path: src/routes/ko/+layout.svelte
    loc: 19
    role: Sets Paraglide locale to 'ko' via setLocale() in onMount (CLIENT-side only — see known_risks.i18n_ssr_locale)

# -----------------------------------------------------------------------------
# SUBSYSTEMS — the 5 architectural concerns (analysis ownership boundaries)
# -----------------------------------------------------------------------------
subsystems:
  routing_ssg_seo:
    purpose: URL → prerendered HTML; SEO surface; feeds; sitemap; View Transitions
    prerender_strategy: >
      `prerender=true` cascades from +layout.ts. Dynamic [slug] is NOT enumerated via
      entries() — adapter-static `strict:true` crawls links to discover post pages.
      Hidden locale-alternate anchors in +layout.svelte give the crawler /ko variants.
      `handleHttpError:'fail'` aborts build on broken internal links.
    key_files:
      'src/routes/+page.{ts,svelte}': 'Home — Terminal vs BlogHome by viewMode; eager glob EN metadata'
      'src/routes/posts/+page.{ts,svelte}': '/posts list + CategorySidebar client-filter (153 loc)'
      'src/routes/posts/[slug]/+page.{ts,svelte}': 'EN post — lazy glob resolves slug → PostDetail (8 loc wrapper)'
      'src/routes/ko/**': 'KO mirror of every EN route; ko/posts/[slug] adds isFallback merge'
      'src/routes/search/+page.svelte': '→ SearchPage (Pagefind)'
      'src/routes/stats/+page.svelte': '→ StatsPage (Umami)'
      'src/routes/system/+page.svelte + system/3b/+page.{ts,svelte}': '→ System3bPage (graph; loads system-snapshot.json)'
      'src/routes/rss.xml/+server.ts': 'EN RSS 2.0 (79 loc)'
      'src/routes/ko/rss.xml/+server.ts': 'KO RSS + EN fallback (104 loc)'
      'src/routes/sitemap.xml/+server.ts': 'hreflang alternates (111 loc); computes hasKorean but does not use it'
      'src/routes/+error.svelte': 'terminal-themed 404/500 ASCII page (97 loc)'
    seo_mechanisms:
      default_meta: src/routes/+layout.svelte
      per_post_jsonld_og_hreflang_canonical: src/lib/components/PostDetail.svelte
      sitemap_hreflang: src/routes/sitemap.xml/+server.ts
      gaps:
        [
          '<html lang> not per-locale',
          'canonical only in PostDetail not all routes',
          'KO prerender locale (see risks)',
        ]
    depends_on: [content_pipeline, components, state_stores, i18n]

  content_pipeline_i18n:
    purpose: 3B knowledge → markdown → compiled Svelte components; EN/KO i18n
    markdown_pipeline:
      preprocess: '[vitePreprocess, mdsvex] over .svelte/.md/.svx'
      remark_chain: [remark-mermaid-component, remark-gfm, remark-reading-time, remark-toc-extract]
      rehype_chain: [rehype-slug]
      highlight: 'Shiki 4 singleton-promise, theme github-dark, ~21 langs'
      layout: 'NONE — each .md emits standalone component; title/desc rendered by PostDetail (implicit contract w/ sync cleanBody)'
    plugins:
      'src/lib/plugins/remark-reading-time.js': 'words/200 → fm.readingTime (counts code blocks — inflates; see improvements)'
      'src/lib/plugins/remark-toc-extract.js': 'h2/h3 → github-slugger → fm.headings[]'
      'src/lib/plugins/remark-mermaid-component.js': '```mermaid fence → <Mermaid code={...}/> before Shiki'
    i18n:
      engine: Paraglide-JS 2 (project.inlang/settings.json; messages/{en,ko}.json — 60 keys, parity)
      runtime_generated: src/lib/paraglide/ (regenerated each build — why build MUST precede check)
      strategy: "['url','cookie','baseLocale'] (vite.config.ts)"
      usage: 'import * as m; m.key()'
      fallback: 'KO missing → ko/posts/[slug]/+page.ts falls back to EN module, sets isFallback → PostDetail banner'
    sync_pipeline:
      script: scripts/sync-from-3b.ts (Deno, 806 loc)
      modes: [default, '--check (hash guard, exit 1)', '--diff', '--reconcile']
      select: 'blog.publishable && blog.ready && status==completed && has authoritative ref && category!=moba'
      transform: 'cleanBody strips H1+first-para+Related/WhenUsed; adds source_content_hash; expanded:true posts are protected/skipped'
    key_files:
      'src/lib/stores/posts.ts': 'PostMetadata type + derived stores + getCategoriesWithCounts/searchPosts (89 loc)'
      'scripts/translation-status.ts': 'EN vs KO coverage (slug-set; no staleness check)'
      'scripts/translation-create.ts': 'scaffold KO template (draft:true, [번역 필요])'
    depends_on: [3B knowledge repo (external), components.Mermaid, utils.date]

  terminal_cli:
    purpose: Interactive Claude-Code-style terminal as an alternate home view
    registry:
      file: src/lib/commands/index.ts (115 loc)
      mechanism: 'module-level Map<string,CommandHandler>; commands self-register via side-effect import in Terminal.svelte'
      types: 'CommandContext (cwd,setCwd,fs,posts,navigateToPost,openFuzzyFinder) ; CommandResult {output,newCwd?}'
    commands: # 18 names across 11 files
      ls.ts: [ls, ll]
      cd.ts: [cd]
      cat.ts: [cat, read]
      grep.ts: [grep, search, find]
      help.ts: [help, man] # commandHelp dict is hand-maintained — drifts from registry
      open.ts: [open] # internal links use window.location (full reload — bypasses View Transitions)
      whoami.ts: [whoami, about]
      clear.ts: [clear, cls] # imports store directly — breaks pure-fn model
      echo.ts: [echo]
      history.ts: [history] # imports store directly
      pwd.ts: [pwd]
    key_files:
      'src/lib/filesystem.ts': "in-memory virtual FS over PostMetadata[] (184 loc); resolvePath skips '..'; getAllFiles unused"
      'src/lib/fuzzy.ts': 'Fuse.js wrapper — indexes title/desc/tags/category/slug (NOT body), threshold 0.4 (73 loc)'
      'src/lib/stores/terminal.ts': "cwd, history, output buffer, OutputLine union incl 'html' (103 loc)"
      'src/lib/components/terminal/Terminal.svelte': 'orchestrator; rebuilds FS on $posts via $effect; global Ctrl+P/K/L (324 loc)'
      'src/lib/components/terminal/CommandLine.svelte': 'hidden-input + block-cursor; tab-complete (cmd names only — path TODO) (332 loc)'
      'src/lib/components/terminal/Output.svelte': "renders OutputLine[]; {@html} branch for type:'html' (DEAD but live sink) (184 loc)"
      'src/lib/components/terminal/FuzzyFinder.svelte': 'Ctrl+P/K modal; no focus trap (402 loc)'
    depends_on: [state_stores.posts, SvelteKit goto (via callback)]

  blog_ui_components:
    purpose: Blog-mode presentation, shared components, app-level state, styling
    key_components:
      'BlogHome.svelte': 'home blog view, recent 10 posts (288 loc; posts via prop, not store)'
      'PostDetail.svelte': 'SHARED EN/KO post page — JSON-LD, SEO, ToC, ReadingProgress, Giscus, copy-link, kbd-nav (262 loc)'
      'CategorySidebar.svelte': 'desktop sidebar + mobile pills; role=tablist mismatch (84 loc)'
      'TableOfContents.svelte': 'IntersectionObserver active-heading; desktop + mobile <details> (101 loc)'
      'ReadingProgress.svelte': 'scroll progress bar, good a11y (19 loc)'
      'ViewToggle.svelte': 'blog/CLI switch; aria-label hardcoded EN (15 loc)'
      'LanguageToggle.svelte': 'EN/KR — URL-based, SSG-safe, no JS needed (37 loc)'
      'Mermaid.svelte': "client render; await import('mermaid'); securityLevel:'loose' + innerHTML (197 loc)"
      'Giscus.svelte': 'GitHub Discussions script injection (55 loc)'
      'SearchPage.svelte': 'Pagefind UI; {@html result.excerpt} (178 loc)'
      'StatsPage.svelte': 'Umami dashboard; HARDCODED API_KEY line 20 (278 loc)'
      'System3bPage.svelte + System3bGraph/Flow/Node/BandNode/FitView.svelte': 'interactive 3B architecture graph; Flow lazy-loaded, route-split'
      'ui/': 'EMPTY dir (shadcn-svelte scaffold, no files, no imports) — dead'
    styling:
      entry: src/app.css ("@import 'tailwindcss'; @plugin typography")
      theme_tokens: '@theme --color-terminal-* (14 colors) + --font-mono + --animate-blink'
      utilities: '@utility prompt-*, output-*, cursor-block, fuzzy-*, prose-terminal'
      debt: 'DUAL variable system — palette defined as @theme tokens AND as :root vars AND hardcoded in System3b/Mermaid scoped <style> (4-5 sync points)'
      theme_mode: 'permanently dark; no light mode / prefers-color-scheme'
    depends_on: [content_pipeline, i18n, state_stores]

  build_tooling_ci:
    purpose: Build pipeline, toolchain, config, CI/CD, deploy
    build_pipeline_ordered:
      - '1. vite build → Paraglide gen (src/lib/paraglide/) FIRST, then Tailwind, then adapter-static prerender'
      - '2. pagefind --site build → build/pagefind/ (after HTML exists)'
      - '3. build/ = static HTML + JS chunks + CSS + pagefind + .br/.gz precompress'
      - 'NOTE: og:generate is NOT in build — manual; static/og has 95 of 139'
    ordering_constraint: '`build` MUST precede `check` — svelte-check imports generated $lib/paraglide/*'
    config_files:
      'package.json': '75 loc; pnpm@10.32.1; type:module; NO engines field; 5 runtime deps rest dev'
      'vite.config.ts': '@ts-nocheck (Deno dual-typedef workaround); plugins tailwind→sveltekit→paraglide'
      'svelte.config.js': 'adapter-static {fallback:404.html, precompress:true, strict:true}; mdsvex chain; Shiki singleton (89 loc)'
      'tsconfig.json': 'strict, verbatimModuleSyntax, moduleResolution:bundler, checkJs, skipLibCheck'
      'eslint.config.js': 'flat (v10); no-explicit-any=warn, no-at-html-tags=warn'
      '.prettierrc.json': 'tabs, singleQuote, trailingComma:all, printWidth 100'
      'deno.json': 'tasks bridge to pnpm + deno scripts; nodeModulesDir:auto; deno.lock PRESENT (3997 lines, v5)'
    scripts: # see package.json for exact commands
      content: [sync, 'sync:check', 'sync:diff', 'sync:reconcile', hash]
      i18n: ['translation:status', 'translation:create']
      assets: ['og:generate', 'og:generate:force']
      quality:
        [
          lint,
          'lint:fix',
          'format',
          'format:check',
          check,
          'check:watch',
          'validate:dates',
          'validate:dates:fix',
        ]
      system: ['deno task snapshot:3b', 'deno task snapshot:3b:check']
    ci_cd:
      hooks:
        pre-commit: [lint, 'format:check', 'validate:dates']
        pre-push: [lint, 'format:check', build, check, 'validate:dates']
      github_workflows:
        ci.yml: 'push/PR to main → install → lint → format:check → build → check → validate:dates → snapshot:3b:check'
        claude.yml + claude-code-review.yml: 'AI assistant workflows (not build/deploy)'
      deploy: 'Cloudflare Pages via dashboard GitHub integration — NO wrangler.toml, NO IaC in repo'
      gaps: ['no test step (no framework)', 'no deploy IaC', 'sync:check not in any hook/CI']

# -----------------------------------------------------------------------------
# CROSS-CUTTING CONCERNS
# -----------------------------------------------------------------------------
cross_cutting:
  security:
    - 'StatsPage.svelte:20 — hardcoded Umami API_KEY (read-only public, but committed secret; 0 PUBLIC_ env usage)'
    - '{@html} sinks: Output.svelte (dead html branch), SearchPage.svelte (Pagefind excerpt), PostDetail.svelte (JSON-LD, controlled)'
    - "Mermaid.svelte:53 securityLevel:'loose' + innerHTML (author-content claim; widens if provenance broadens)"
  a11y:
    - '<html lang> not per-locale'
    - 'terminal output role=log without explicit aria-live; FuzzyFinder no focus trap'
    - 'CategorySidebar mobile role=tablist without tabpanels (should be nav + aria-pressed)'
    - 'ViewToggle aria-label hardcoded English (i18n gap)'
  state_stores:
    'posts.ts': 'writable PostMetadata[] — hydrated ONLY in home onMount; deep-link to /posts/* leaves terminal store empty'
    'viewMode.ts': "writable 'blog'|'terminal'; localStorage 'brandonwie-view-mode'; default blog"
    'terminal.ts': 'cwd/history/output buffers'
  utils:
    'src/lib/utils/date.ts': 'effectiveDate (updated||date), formatDateShort/Long, locale-aware (KO YYYY.MM.DD)'
    'src/lib/utils/system3b-graph.ts': 'dagre layout for system graph'
  data_artifacts:
    'src/lib/data/system-snapshot.json': 'committed; generated by deno snapshot:3b; CI validates schema not freshness'
    'static/og/*.png': '95 OG images (94 slug + 1 default, Satori→resvg); manual gen; 45 of 139 posts missing'

